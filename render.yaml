services:
  - type: web
    name: watch-togather
    runtime: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ..
    startCommand: node main.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 8080
      - key: GROQ_API_KEY
        sync: false
